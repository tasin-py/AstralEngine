<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <!-- Astral Engine vs Wallpaper Engine, data from benchmarks/RESULTS.md (paused-by-maximized-window run). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17133f"/>
      <stop offset="1" stop-color="#08091b"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="astral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.6" stop-color="#ff9a62"/>
      <stop offset="1" stop-color="#e35d8a"/>
    </linearGradient>
    <linearGradient id="we" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5f7d"/>
      <stop offset="1" stop-color="#7d82a3"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#ff9a62"/>
      <stop offset="1" stop-color="#b9a4ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe7c2"/>
    </linearGradient>
    <filter id="glow" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1280" height="760" rx="28"/></clipPath>
    <style>
      text { font-family: 'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
      .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .fade { animation: fade 1s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .arc { animation: arc 2s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes arc { from { stroke-dashoffset: 340 } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.1) } }
      .tw { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s1 { animation-delay: .15s } .s2 { animation-delay: .3s } .s3 { animation-delay: .45s } .s4 { animation-delay: .6s }
      .s5 { animation-delay: .75s } .s6 { animation-delay: .9s } .s7 { animation-delay: 1.05s } .s8 { animation-delay: 1.2s }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="760" fill="url(#bg)"/>
    <ellipse cx="200" cy="120" rx="380" ry="260" fill="url(#neb)"/>
    <ellipse cx="1150" cy="640" rx="380" ry="260" fill="url(#neb2)"/>
    <g fill="#fff">
      <circle cx="80" cy="700" r="1.2" opacity=".5"/><circle cx="420" cy="40" r="1" opacity=".6"/>
      <circle cx="760" cy="30" r="1.3" opacity=".5"/><circle cx="1230" cy="120" r="1.2" opacity=".6"/>
      <circle cx="1000" cy="730" r="1" opacity=".5"/><circle cx="620" cy="740" r="1.1" opacity=".4"/>
      <circle class="tw" cx="1180" cy="54" r="2"/><circle class="tw s3" cx="40" cy="420" r="1.8"/>
      <circle class="tw s6" cx="680" cy="720" r="1.8"/>
    </g>

    <!-- header -->
    <g class="fade">
      <text x="64" y="78" font-size="14" letter-spacing="5" fill="#b9a4ff" font-weight="600">RESOURCE USAGE</text>
      <text x="62" y="126" font-size="42" font-weight="700" fill="url(#title)">Astral Engine vs Wallpaper Engine</text>
      <text x="64" y="160" font-size="17" fill="#c9c5e6" opacity=".8">Same PC · same Workshop video · both paused by a maximized window · measured with scripts/bench-processes.ps1</text>
    </g>
    <g transform="translate(1000 66)" font-size="15" font-weight="600"><g class="fade s2">
      <rect width="22" height="12" rx="6" y="-10" fill="url(#astral)"/><text x="32" y="1" fill="#fff">Astral Engine</text>
      <rect width="22" height="12" rx="6" y="18" fill="url(#we)"/><text x="32" y="29" fill="#c9c5e6">Wallpaper Engine</text>
    </g></g>

    <!-- hero gauges -->
    <g font-weight="700">
      <g transform="translate(64 196)"><g class="fade s1">
        <rect width="368" height="196" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <circle cx="98" cy="98" r="54" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="12"/>
        <circle class="arc s2" cx="98" cy="98" r="54" fill="none" stroke="url(#gauge)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="339.3" stroke-dashoffset="64.5" transform="rotate(-90 98 98)" filter="url(#glow)"/>
        <text x="98" y="108" font-size="28" fill="#fff" text-anchor="middle">81%</text>
        <text x="180" y="86" font-size="30" fill="#fff">less RAM</text>
        <text x="180" y="116" font-size="16" fill="#c9c5e6" font-weight="500">156 MB vs 808 MB</text>
        <text x="180" y="140" font-size="13" fill="#9d98c4" font-weight="500">whole app, idle</text></g>
      </g>
      <g transform="translate(456 196)"><g class="fade s2">
        <rect width="368" height="196" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <circle cx="98" cy="98" r="54" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="12"/>
        <circle class="arc s3" cx="98" cy="98" r="54" fill="none" stroke="url(#gauge)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="339.3" stroke-dashoffset="13.6" transform="rotate(-90 98 98)" filter="url(#glow)"/>
        <text x="98" y="108" font-size="28" fill="#fff" text-anchor="middle">96%</text>
        <text x="180" y="86" font-size="30" fill="#fff">less CPU</text>
        <text x="180" y="116" font-size="16" fill="#c9c5e6" font-weight="500">0.14 % vs 3.86 %</text>
        <text x="180" y="140" font-size="13" fill="#9d98c4" font-weight="500">whole app, idle</text></g>
      </g>
      <g transform="translate(848 196)"><g class="fade s3">
        <rect width="368" height="196" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <circle cx="98" cy="98" r="54" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="12"/>
        <circle class="arc s4" cx="98" cy="98" r="54" fill="none" stroke="url(#gauge)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="339.3" stroke-dashoffset="0.01" transform="rotate(-90 98 98)" filter="url(#glow)"/>
        <text x="98" y="108" font-size="24" fill="#fff" text-anchor="middle">100%</text>
        <text x="180" y="86" font-size="30" fill="#fff">less GPU</text>
        <text x="180" y="116" font-size="16" fill="#c9c5e6" font-weight="500">0.00 % vs 0.56 %</text>
        <text x="180" y="140" font-size="13" fill="#9d98c4" font-weight="500">while paused</text></g>
      </g>
    </g>

    <!-- bar comparisons -->
    <g transform="translate(64 432)">
      <rect width="1152" height="268" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
      <g font-size="16" font-weight="600">
        <!-- row 1: RAM whole app (max 808) -->
        <text x="32" y="48" fill="#fff">RAM · whole app</text>
        <rect class="grow s2" x="300" y="30" width="700" height="14" rx="7" fill="url(#we)"/>
        <text class="fade s5" x="1012" y="43" fill="#c9c5e6">808 MB</text>
        <rect class="grow s3" x="300" y="50" width="135" height="14" rx="7" fill="url(#astral)" filter="url(#glow)"/>
        <text class="fade s6" x="447" y="63" fill="#ffd27a">156 MB</text>

        <!-- row 2: RAM wallpaper only (scale 808) -->
        <text x="32" y="112" fill="#fff">RAM · wallpaper only</text>
        <rect class="grow s3" x="300" y="94" width="146" height="14" rx="7" fill="url(#we)"/>
        <text class="fade s6" x="458" y="107" fill="#c9c5e6">169 MB</text>
        <rect class="grow s4" x="300" y="114" width="135" height="14" rx="7" fill="url(#astral)" filter="url(#glow)"/>
        <text class="fade s7" x="447" y="127" fill="#ffd27a">156 MB</text>

        <!-- row 3: CPU (max 3.86) -->
        <text x="32" y="176" fill="#fff">CPU · whole app</text>
        <rect class="grow s4" x="300" y="158" width="700" height="14" rx="7" fill="url(#we)"/>
        <text class="fade s7" x="1012" y="171" fill="#c9c5e6">3.86 %</text>
        <rect class="grow s5" x="300" y="178" width="25" height="14" rx="7" fill="url(#astral)" filter="url(#glow)"/>
        <text class="fade s8" x="337" y="191" fill="#ffd27a">0.14 %</text>

        <!-- row 4: GPU (max 0.56) -->
        <text x="32" y="240" fill="#fff">GPU · paused</text>
        <rect class="grow s5" x="300" y="222" width="700" height="14" rx="7" fill="url(#we)"/>
        <text class="fade s8" x="1012" y="235" fill="#c9c5e6">0.56 %</text>
        <rect class="grow s6" x="300" y="242" width="6" height="14" rx="3" fill="url(#astral)" filter="url(#glow)"/>
        <text class="fade s8" x="318" y="255" fill="#ffd27a">0.00 %</text>
      </g>
    </g>

    <text x="64" y="732" font-size="14" fill="#9d98c4">While playing a video with the library closed, Astral uses 372 MB RAM · 2.6 % CPU. Full data: benchmarks/RESULTS.md</text>
    <g transform="translate(1196 726)" fill="#fff"><path class="pulse" d="M0 -12 Q1.5 -1.5 12 0 Q1.5 1.5 0 12 Q-1.5 1.5 -12 0 Q-1.5 -1.5 0 -12 Z"/></g>
  </g>
  <rect x="1" y="1" width="1278" height="758" rx="27" fill="none" stroke="#b9a4ff" stroke-opacity=".25" stroke-width="2"/>
</svg>
