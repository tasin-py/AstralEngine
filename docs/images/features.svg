<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <!-- Astral Engine feature highlights -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17133f"/>
      <stop offset="1" stop-color="#08091b"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#ff8a65"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9b8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fe3ff"/><stop offset="1" stop-color="#3b8cff"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset="1" stop-color="#e3477e"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8ffd8"/><stop offset="1" stop-color="#22b88a"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#e0a64a"/></linearGradient>
    <filter id="glow" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1280" height="560" rx="28"/></clipPath>
    <style>
      text { font-family: 'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
      .bob { animation: bob 4.5s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      .b2 { animation-delay: -.75s } .b3 { animation-delay: -1.5s } .b4 { animation-delay: -2.25s } .b5 { animation-delay: -3s } .b6 { animation-delay: -3.75s }
      .tw { animation: tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes tw { 0%,100% { opacity: .3; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.1) } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <ellipse cx="1100" cy="80" rx="360" ry="240" fill="url(#neb)"/>
    <ellipse cx="160" cy="520" rx="360" ry="240" fill="url(#neb2)"/>
    <g fill="#fff">
      <circle cx="640" cy="30" r="1.2" opacity=".5"/><circle cx="1240" cy="520" r="1.2" opacity=".5"/>
      <circle cx="30" cy="60" r="1" opacity=".6"/><circle cx="900" cy="540" r="1" opacity=".5"/>
      <circle class="tw" cx="1210" cy="40" r="2"/><circle class="tw" style="animation-delay:-1.4s" cx="48" cy="300" r="1.8"/>
    </g>

    <text x="64" y="76" font-size="14" letter-spacing="5" fill="#b9a4ff" font-weight="600">EVERYTHING IN ONE PLACE</text>
    <text x="62" y="120" font-size="38" font-weight="700" fill="#fff">Your desktop, alive.</text>

    <!-- tiles: 3 x 2, 368 x 170 -->
    <g font-weight="600">
      <!-- 1 scenes -->
      <g transform="translate(64 156)"><g class="bob">
        <rect width="368" height="170" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <g transform="translate(52 56)" filter="url(#glow)">
          <circle r="26" fill="url(#g1)"/>
          <ellipse rx="40" ry="11" fill="none" stroke="#fff1c9" stroke-width="4" transform="rotate(-20)"/>
        </g>
        <text x="106" y="52" font-size="22" fill="#fff">Scene wallpapers</text>
        <text x="106" y="78" font-size="14" fill="#c9c5e6" font-weight="500">Native renderer for Wallpaper Engine</text>
        <text x="106" y="98" font-size="14" fill="#c9c5e6" font-weight="500">scenes: shaders, particles, parallax,</text>
        <text x="106" y="118" font-size="14" fill="#c9c5e6" font-weight="500">SceneScript and audio response.</text>
      </g></g>
      <!-- 2 workshop -->
      <g transform="translate(456 156)"><g class="bob b2">
        <rect width="368" height="170" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <g transform="translate(52 56)" filter="url(#glow)">
          <circle r="28" fill="url(#g3)"/>
          <circle r="10" fill="none" stroke="#fff" stroke-width="4"/>
          <path d="M-18 14 L-6 6 M10 -6 L20 -16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <circle cx="-20" cy="16" r="5" fill="#fff"/><circle cx="22" cy="-18" r="5" fill="#fff"/>
        </g>
        <text x="106" y="52" font-size="22" fill="#fff">Steam Workshop</text>
        <text x="106" y="78" font-size="14" fill="#c9c5e6" font-weight="500">Finds your subscriptions on its own.</text>
        <text x="106" y="98" font-size="14" fill="#c9c5e6" font-weight="500">Browse and search with no login;</text>
        <text x="106" y="118" font-size="14" fill="#c9c5e6" font-weight="500">subscribe safely in your Steam app.</text>
      </g></g>
      <!-- 3 video & web -->
      <g transform="translate(848 156)"><g class="bob b3">
        <rect width="368" height="170" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <g transform="translate(52 56)" filter="url(#glow)">
          <rect x="-28" y="-20" width="56" height="40" rx="10" fill="url(#g4)"/>
          <path d="M-7 -10 L11 0 L-7 10 Z" fill="#fff"/>
        </g>
        <text x="106" y="52" font-size="22" fill="#fff">Video &amp; web</text>
        <text x="106" y="78" font-size="14" fill="#c9c5e6" font-weight="500">MP4, WebM and HEVC with hardware</text>
        <text x="106" y="98" font-size="14" fill="#c9c5e6" font-weight="500">decoding, HTML wallpapers with the</text>
        <text x="106" y="118" font-size="14" fill="#c9c5e6" font-weight="500">full web API, images and your files.</text>
      </g></g>
      <!-- 4 widgets -->
      <g transform="translate(64 350)"><g class="bob b4">
        <rect width="368" height="170" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <g transform="translate(52 56)" filter="url(#glow)">
          <rect x="-26" y="-26" width="23" height="23" rx="6" fill="url(#g2)"/>
          <rect x="3" y="-26" width="23" height="23" rx="6" fill="url(#g2)" opacity=".7"/>
          <rect x="-26" y="3" width="23" height="23" rx="6" fill="url(#g2)" opacity=".7"/>
          <rect x="3" y="3" width="23" height="23" rx="6" fill="url(#g2)"/>
        </g>
        <text x="106" y="52" font-size="22" fill="#fff">Widgets &amp; Rainmeter</text>
        <text x="106" y="78" font-size="14" fill="#c9c5e6" font-weight="500">11 built-in widgets: clock, weather,</text>
        <text x="106" y="98" font-size="14" fill="#c9c5e6" font-weight="500">system monitor, visualiser and more,</text>
        <text x="106" y="118" font-size="14" fill="#c9c5e6" font-weight="500">plus a full Rainmeter skin manager.</text>
      </g></g>
      <!-- 5 performance -->
      <g transform="translate(456 350)"><g class="bob b5">
        <rect width="368" height="170" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <g transform="translate(52 56)" filter="url(#glow)">
          <circle r="28" fill="url(#g5)"/>
          <path d="M4 -18 L-10 3 L0 3 L-4 18 L10 -3 L0 -3 Z" fill="#fff"/>
        </g>
        <text x="106" y="52" font-size="22" fill="#fff">Light on resources</text>
        <text x="106" y="78" font-size="14" fill="#c9c5e6" font-weight="500">Smart pause per monitor, FPS limit,</text>
        <text x="106" y="98" font-size="14" fill="#c9c5e6" font-weight="500">and switches that fully unload any</text>
        <text x="106" y="118" font-size="14" fill="#c9c5e6" font-weight="500">extra feature you don't use.</text>
      </g></g>
      <!-- 6 customise -->
      <g transform="translate(848 350)"><g class="bob b6">
        <rect width="368" height="170" rx="22" fill="url(#tile)" stroke="#fff" stroke-opacity=".1"/>
        <g transform="translate(52 56)" filter="url(#glow)">
          <circle r="28" fill="url(#g6)"/>
          <path d="M-14 -8 H14 M-14 8 H14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <circle cx="-4" cy="-8" r="6" fill="#fff"/><circle cx="7" cy="8" r="6" fill="#fff"/>
        </g>
        <text x="106" y="52" font-size="22" fill="#fff">Make it yours</text>
        <text x="106" y="78" font-size="14" fill="#c9c5e6" font-weight="500">Colours, speed, volume and filters for</text>
        <text x="106" y="98" font-size="14" fill="#c9c5e6" font-weight="500">every wallpaper, presets, playlists,</text>
        <text x="106" y="118" font-size="14" fill="#c9c5e6" font-weight="500">multi-monitor and taskbar styling.</text>
      </g></g>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="558" rx="27" fill="none" stroke="#b9a4ff" stroke-opacity=".25" stroke-width="2"/>
</svg>
