<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <!-- Astral Engine README banner. Animations are pure CSS so they play inside GitHub's <img>. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1650"/>
      <stop offset="0.5" stop-color="#0f0d2e"/>
      <stop offset="1" stop-color="#07081a"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.45" stop-color="#ffab5e"/>
      <stop offset="1" stop-color="#d4557a"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a0d35" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a4ff"/>
      <stop offset="0.5" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffe7c2"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pc"><circle r="112"/></clipPath>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="30"/></filter>
    <style>
      .tw { animation: tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: -0.4s } .d2 { animation-delay: -1.1s } .d3 { animation-delay: -1.9s } .d4 { animation-delay: -2.6s }
      @keyframes tw { 0%,100% { opacity: .25; transform: scale(.6) } 50% { opacity: 1; transform: scale(1.15) } }
      .spark { animation: spark 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spark { 0%,100% { transform: scale(.75) rotate(0deg); opacity: .8 } 50% { transform: scale(1.1) rotate(45deg); opacity: 1 } }
      .float { animation: float 7s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
      .drift { animation: drift 18s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(-30px) } to { transform: translateX(30px) } }
      .shoot { animation: shoot 6s ease-in infinite; opacity: 0; }
      @keyframes shoot { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 } 14% { transform: translate(-360px,150px); opacity: 0 } 100% { transform: translate(-360px,150px); opacity: 0 } }
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-520px) } 60%,100% { transform: translateX(620px) } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#sky)"/>
    <g class="drift">
      <ellipse cx="300" cy="230" rx="330" ry="230" fill="url(#nebulaA)"/>
      <ellipse cx="1050" cy="90" rx="320" ry="200" fill="url(#nebulaB)"/>
      <ellipse cx="820" cy="380" rx="380" ry="170" fill="url(#nebulaC)"/>
    </g>

    <!-- star field -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.2" opacity=".6"/><circle cx="140" cy="350" r="1" opacity=".5"/>
      <circle cx="520" cy="60" r="1.3" opacity=".7"/><circle cx="610" cy="380" r="1" opacity=".5"/>
      <circle cx="700" cy="30" r="1" opacity=".6"/><circle cx="780" cy="300" r="1.2" opacity=".4"/>
      <circle cx="900" cy="370" r="1.4" opacity=".6"/><circle cx="1010" cy="250" r="1" opacity=".5"/>
      <circle cx="1100" cy="380" r="1.1" opacity=".6"/><circle cx="1220" cy="60" r="1.3" opacity=".7"/>
      <circle cx="1240" cy="300" r="1" opacity=".5"/><circle cx="460" cy="250" r="1" opacity=".4"/>
      <circle cx="30" cy="200" r="1" opacity=".5"/><circle cx="1180" cy="190" r="1" opacity=".5"/>
      <circle cx="560" cy="160" r="1.1" opacity=".5"/><circle cx="960" cy="40" r="1" opacity=".6"/>
      <circle class="tw" cx="96" cy="110" r="2.2"/><circle class="tw d1" cx="470" cy="340" r="2"/>
      <circle class="tw d2" cx="1150" cy="120" r="2.4"/><circle class="tw d3" cx="860" cy="60" r="1.8"/>
      <circle class="tw d4" cx="1200" cy="350" r="2"/><circle class="tw d2" cx="250" cy="390" r="1.8"/>
      <circle class="tw d1" cx="660" cy="110" r="1.6"/><circle class="tw d3" cx="1050" cy="330" r="1.8"/>
    </g>

    <!-- shooting stars -->
    <g class="shoot"><line x1="1180" y1="30" x2="1260" y2="0" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/></g>
    <g class="shoot" style="animation-delay:3.1s"><line x1="760" y1="20" x2="830" y2="-8" stroke="#cfe6ff" stroke-width="1.6" stroke-linecap="round"/></g>

    <!-- Saturn -->
    <g transform="translate(270 215)">
      <circle r="190" fill="#8b6cff" opacity=".35" filter="url(#soft)"/>
      <g class="float">
        <g transform="rotate(-22) scale(.92)">
          <path d="M -212 0 A 212 64 0 0 1 212 0" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" opacity=".85"/>
          <path d="M -178 0 A 178 50 0 0 1 178 0" fill="none" stroke="#1b1640" stroke-width="5" opacity=".6"/>
          <circle r="112" fill="url(#planet)"/>
          <g clip-path="url(#pc)" opacity=".35">
            <rect x="-130" y="-58" width="260" height="16" fill="#fff4d6"/>
            <rect x="-130" y="-14" width="260" height="22" fill="#b8426a"/>
            <rect x="-130" y="34" width="260" height="12" fill="#fff4d6"/>
            <rect x="-130" y="68" width="260" height="18" fill="#9c3560"/>
          </g>
          <circle r="112" fill="url(#shade)"/>
          <path d="M -212 0 A 212 64 0 0 0 212 0" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>
          <path d="M -178 0 A 178 50 0 0 0 178 0" fill="none" stroke="#1b1640" stroke-width="5" opacity=".55"/>
        </g>
      </g>
    </g>
    <g fill="#fff" filter="url(#glow)">
      <g transform="translate(420 82)"><path class="spark" d="M0 -34 Q4 -4 34 0 Q4 4 0 34 Q-4 4 -34 0 Q-4 -4 0 -34 Z"/></g>
      <g transform="translate(110 300)"><path class="spark" style="animation-delay:-1.5s" d="M0 -20 Q2.5 -2.5 20 0 Q2.5 2.5 0 20 Q-2.5 2.5 -20 0 Q-2.5 -2.5 0 -20 Z" fill="#cfe6ff"/></g>
      <g transform="translate(1190 250)"><path class="spark" style="animation-delay:-2.7s" d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16 Z" fill="#ffe7c2"/></g>
    </g>

    <!-- wordmark -->
    <g font-family="'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
      <text x="560" y="150" font-size="15" letter-spacing="6" fill="#b9a4ff" font-weight="600">LIVE WALLPAPERS FOR WINDOWS</text>
      <text x="556" y="235" font-size="92" font-weight="700" fill="url(#title)" letter-spacing="-1">Astral Engine</text>
      <text x="560" y="282" font-size="22" fill="#d8d4f0" opacity=".85">Scenes · Videos · Web · Steam Workshop · Widgets · Rainmeter</text>

      <g transform="translate(560 316)" font-size="15" font-weight="600">
        <rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#b9a4ff" stroke-opacity=".45"/>
        <text x="84" y="25" text-anchor="middle" fill="#fff">⚡ 81% less RAM</text>
        <rect x="180" width="168" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffab5e" stroke-opacity=".5"/>
        <text x="264" y="25" text-anchor="middle" fill="#fff">🪶 96% less CPU</text>
        <rect x="360" width="190" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#9fd0ff" stroke-opacity=".5"/>
        <text x="455" y="25" text-anchor="middle" fill="#fff">💎 Free &amp; open source</text>
      </g>
    </g>

    <!-- light sweep across the wordmark -->
    <g opacity=".18" transform="skewX(-20)">
      <rect class="sweep" x="620" y="160" width="120" height="90" fill="url(#shine)"/>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#b9a4ff" stroke-opacity=".25" stroke-width="2"/>
</svg>
